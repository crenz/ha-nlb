[project]
name = "ha-nlb"
version = "0.1.0"
description = "Home Assistant integration for National Library Board (NLB) Singapore accounts"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
files = ["custom_components/nlb"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=custom_components.nlb --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95
